name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-release:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog

      - name: Determine next version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run --branches main --plugins "@semantic-release/commit-analyzer" "@semantic-release/release-notes-generator" "@semantic-release/changelog" "@semantic-release/github" 2>&1 | tee semantic-release.log
          VERSION=$(perl -ne 's/\e\[[0-9;]*[[:alpha:]]//g; print "$1\n" if /the next release version is (\S+)/i' semantic-release.log | tail -n 1)
          if [[ -z "$VERSION" ]]; then
            if grep -q "There are no relevant changes, so no new version is released" semantic-release.log; then
              echo "No release is needed for these commits."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No release version was found in semantic-release output."
            exit 1
          fi
          echo "Detected release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.version != ''
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Update version in package.json
        run: |
          npm version "${VERSION#v}" --no-git-tag-version
          echo "Updated package.json to version $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Generate Package VSIX
        run: npm run package

      - name: Upload Package VSIX
        uses: actions/upload-artifact@v4
        with:
          name: package-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Publish to marketplace
        run: npm run publish
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [prepare-release, publish]
    if: needs.prepare-release.outputs.version != ''
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog

      - name: Download Package VSIX
        uses: actions/download-artifact@v4
        with:
          name: package-vsix
          path: vsix

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --branches main --plugins "@semantic-release/commit-analyzer" "@semantic-release/release-notes-generator" "@semantic-release/changelog" "@semantic-release/github"
          gh release upload "$VERSION" vsix/*.vsix --clobber
