name: CI Pipeline

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci
        
      - run: xvfb-run -a npm run test
        if: runner.os == 'Linux'

      - run: npm run test
        if: runner.os != 'Linux'

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npm run package
