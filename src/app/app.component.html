<div class="layout">
  <section class="header">
    <app-nav-bar></app-nav-bar>
    <app-tool-bar></app-tool-bar>
    <div *ngIf="packageManager.currentPackageOperation | async as operation" class="package-operation" role="status" aria-live="polite">
      <span class="operation-spinner" aria-hidden="true"></span>
      <span>
        {{ operation.action === 'remove' ? 'Uninstalling' : operation.action === 'update' ? 'Updating' : 'Installing' }}
        {{ operation.packageId }}...
      </span>
    </div>
  </section>
  <section class="main-section">
    <as-split direction="horizontal" [gutterSize]="5">
      <as-split-area [size]="60" [minSize]="20">
        <app-package-list></app-package-list>
      </as-split-area>
      <as-split-area [size]="40" [minSize]="20">
        <app-package-details></app-package-details>
      </as-split-area>
    </as-split>
  </section>
</div>
