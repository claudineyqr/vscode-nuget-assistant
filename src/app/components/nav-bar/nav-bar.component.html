<nav class="navbar flex min-w-0 items-center justify-between border-b border-vscode-border px-4 py-2" role="navigation"
  aria-label="main navigation" i18n-aria-label="@@navigation.main.accessibleLabel">
  <div class="navbar-start flex shrink-0 items-center gap-1">
    <button
      class="navbar-item category-button select-none rounded-t-md border-b-2 px-3 py-2 text-sm font-medium transition-colors motion-reduce:transition-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-vscode-focus"
      [ngClass]="currentCategory === Category.Browse ? 'border-vscode-accent text-vscode-accent' : 'border-transparent text-vscode-muted hover:bg-vscode-hover hover:text-vscode-foreground'"
      (click)="categoryChange(Category.Browse)">
      <span i18n="@@navigation.browse.tab">Browse</span>
    </button>
    <button
      class="navbar-item category-button select-none rounded-t-md border-b-2 px-3 py-2 text-sm font-medium transition-colors motion-reduce:transition-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-vscode-focus"
      [ngClass]="currentCategory === Category.Installed ? 'border-vscode-accent text-vscode-accent' : 'border-transparent text-vscode-muted hover:bg-vscode-hover hover:text-vscode-foreground'"
      (click)="categoryChange(Category.Installed)" i18n="@@navigation.installed.tab">
      Installed
    </button>
    <button
      class="navbar-item category-button select-none rounded-t-md border-b-2 px-3 py-2 text-sm font-medium transition-colors motion-reduce:transition-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-vscode-focus"
      [ngClass]="currentCategory === Category.Updates ? 'border-vscode-accent text-vscode-accent' : 'border-transparent text-vscode-muted hover:bg-vscode-hover hover:text-vscode-foreground'"
      (click)="categoryChange(Category.Updates)" i18n="@@navigation.updates.tab">
      Updates
    </button>
  </div>

  <div class="navbar-end min-w-0 shrink" [title]="currentProjectFsPath">
    <div class="navbar-item">
      <span class="project-name block max-w-[40vw] truncate rounded-md px-2 py-1 text-xs text-vscode-muted"
        i18n="@@navigation.projectTitle">NuGet Assistant: {{ currentProjectName }}</span>
    </div>
  </div>
</nav>
