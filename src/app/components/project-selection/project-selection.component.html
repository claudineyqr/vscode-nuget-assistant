@if (projects.length > 1) {
<section class="project-selection border-b border-vscode-border px-3 py-2">
  <div class="project-header my-1 grid items-center gap-1.5 text-xs font-semibold text-vscode-muted"
    [ngClass]="showVersion ? 'grid-cols-[16px_minmax(0,1fr)_90px_90px]' : 'grid-cols-[16px_minmax(0,1fr)_90px]'">
    <span></span>
    <span i18n="@@projectSelection.project.column">Project</span>
    @if (showVersion) {
    <span i18n="@@projectSelection.version.column">Version</span>
    }
    <span i18n="@@projectSelection.installed.column">Installed</span>
  </div>
  <label
    class="select-all-option my-1 flex cursor-pointer select-none items-center gap-1.5 border-b border-vscode-border pb-2 text-xs font-medium text-vscode-foreground">
    <input class="vscode-checkbox" type="checkbox" [checked]="areAllSelected" (change)="toggleAll($event)" />
    <span i18n="@@projectSelection.selectAll">Select all projects</span>
  </label>
  @for (project of projects; track project) {
  <label
    class="project-option my-1 grid cursor-pointer select-none items-center gap-1.5 rounded px-1 py-1 text-xs transition-colors motion-reduce:transition-none hover:bg-vscode-hover"
    [ngClass]="showVersion ? 'grid-cols-[16px_minmax(0,1fr)_90px_90px]' : 'grid-cols-[16px_minmax(0,1fr)_90px]'">
    <input type="checkbox" [checked]="isSelected(project.fsPath)" class="vscode-checkbox"
      (change)="toggle(project.fsPath, $event)" />
    <span class="truncate">{{ project.name }}</span>
    @if (showVersion) {
    <span class="truncate tabular-nums text-vscode-muted">{{ getPackageVersion(project) }}</span>
    }
    <span class="truncate tabular-nums text-vscode-muted">{{ getInstalledVersion(project) }}</span>
  </label>
  }
</section>
}
